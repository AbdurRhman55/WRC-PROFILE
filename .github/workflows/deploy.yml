
name: Deploy WRC to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify deployment files
        shell: bash
        run: |
          set -e

          for item in \
            database/run_project_import.php \
            includes/footer.php \
            includes/form-submit.php \
            includes/functions.php \
            includes/header.php \
            index.php
          do
            if [ ! -f "$item" ]; then
              echo "ERROR: Missing required file: $item"
              exit 1
            fi
          done

          echo "SUCCESS: Required deployment files are present."

      - name: Deploy WRC files to Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          debug: true
          source: "about,admin,assets,contact,database,get-involved,impact,news,our-work,projects,resources,where-we-work,index.php,privacy.html,privacy.php,includes/footer.php,includes/form-submit.php,includes/functions.php,includes/header.php,includes/newsletter-subscribe.php,terms.html,terms.php"
          target: "/home/u817261572/domains/limegreen-anteater-521120.hostingersite.com/public_html"
          overwrite: true

      - name: Diagnose Hostinger SSH and PHP
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          debug: true
          script: |
            set -eu

            echo "=== SSH CONNECTION SUCCESSFUL ==="
            whoami

            DEPLOY_DIR="/home/u817261572/domains/limegreen-anteater-521120.hostingersite.com/public_html"

            echo "=== CHECK DEPLOYMENT DIRECTORY ==="
            echo "Expected path: $DEPLOY_DIR"

            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "ERROR: Deployment directory does not exist."
              exit 1
            fi

            cd "$DEPLOY_DIR"

            echo "=== CURRENT DIRECTORY ==="
            pwd

            echo "=== CHECK IMPORT SCRIPT ==="
            if [ ! -f database/run_project_import.php ]; then
              echo "ERROR: Import script is missing."
              exit 1
            fi

            ls -l database/run_project_import.php

            echo "=== CHECK PHP CLI ==="
            if ! command -v php >/dev/null 2>&1; then
              echo "ERROR: PHP CLI is unavailable."
              exit 1
            fi

            php -v

            echo "=== CHECK PHP SYNTAX ==="
            if ! php -l database/run_project_import.php; then
              echo "ERROR: PHP syntax check failed."
              exit 1
            fi

            echo "=== DIAGNOSTIC CHECKS COMPLETED ==="
            echo "Database import was not executed."

