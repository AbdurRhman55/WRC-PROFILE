name: Deploy WRC to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          source: "about,admin,assets,contact,database,get-involved,impact,news,our-work,projects,resources,where-we-work,index.php,privacy.html,privacy.php,includes/footer.php,includes/form-submit.php,includes/functions.php,includes/header.php,includes/newsletter-subscribe.php,terms.html,terms.php"
          target: "/home/u817261572/domains/limegreen-anteater-521120.hostingersite.com/public_html"
          overwrite: true

      - name: Import WRC project portfolio into live database
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            set -e
            cd /home/u817261572/domains/limegreen-anteater-521120.hostingersite.com/public_html
            printf 'Require all denied\n' > database/.htaccess
            result="$(php database/run_project_import.php)"
            printf '%s\n' "$result"
            case "$result" in
              "Imported and verified all 20 WRC Excel projects."*|"Project portfolio already matches the 20 approved Excel entries; no changes made.") ;;
              *) echo 'Project database import did not confirm success.' >&2; exit 1 ;;
            esac
